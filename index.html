    <!-- 🔧 [เวอร์ชันเดียวคุมทั้งเว็บ] แก้เลขตรงนี้ที่เดียว → js/css/pages ทุกไฟล์โหลดใหม่หมด ไม่มีไฟล์เก่าค้าง cache -->

        })(window._APP_VERSION);

    <script>
        function toggleSubMenu(menuId, iconId) {
            const menu = document.getElementById(menuId);
            const icon = document.getElementById(iconId);
            if(menu.classList.contains('hidden')) {
                menu.classList.remove('hidden'); menu.classList.add('flex');
                icon.style.transform = 'rotate(90deg)';
            } else {
                menu.classList.add('hidden'); menu.classList.remove('flex');
                icon.style.transform = 'rotate(0deg)';
            }
        }
    </script>

    <!-- 🎩 Premium Theme Override — กราไฟต์ดำ × ทองแชมเปญ (เข้าชุดหน้า login) -->
    <style id="premium-theme">
        /* แถบเมนูซ้าย: พื้นเรียบลึก ขอบบางเนียน */
        #menu-list .nm-menu-title{
            font-size:13px; letter-spacing:0.02em; color:#aab6c8;
            border-bottom:1px solid rgba(255,255,255,0.04) !important;
            transition:background .15s,color .15s;
        }
        #menu-list .nm-menu-title:hover{ background:rgba(232,193,90,0.05); color:#f1f5f9; }
        #menu-list .nm-menu-title.active{
            background:linear-gradient(90deg,rgba(232,193,90,0.12),transparent 70%);
            color:#f5e3ae; box-shadow:inset 3px 0 0 #E8C15A;
        }
        /* ไอคอนเมนู: เลิกสีสายรุ้ง → โทนเดียวนิ่ง ๆ, ทองเฉพาะอันที่เลือก */
        #menu-list .nm-menu-title .material-icons{ color:#5d6b82 !important; font-size:18px !important; }
        #menu-list .nm-menu-title:hover .material-icons{ color:#c9d3e0 !important; }
        #menu-list .nm-menu-title.active .material-icons{ color:#E8C15A !important; }
        /* เมนูย่อย discord/admin */
        #menu-discord button:hover, #menu-admin button:hover{ color:#f5e3ae !important; background:rgba(232,193,90,0.06) !important; }
        /* 📐 ปุ่มหุบแถบ: โชว์เฉพาะจอคอม */
        .sidebar-collapse-row{ display:none; border-top:1px solid rgba(255,255,255,0.06); padding-top:10px; margin-top:8px; }
        @media (min-width:768px){
            .sidebar-collapse-row{ display:flex; justify-content:center; }
            #sidebarNav.sidebar-mini{ width:66px !important; }
            /* 🌟 กติกาหลัก: ตอนหุบ โชว์แค่ชิป 5 หมวดเสมอ — ปุ่มเมนูซ่อนหมดไม่ว่าหมวดกางหรือพับ */
            #sidebarNav.sidebar-mini #menu-list > button{ display:none !important; }
            #sidebarNav.sidebar-mini #menu-discord, #sidebarNav.sidebar-mini #menu-admin{ display:none !important; }
            /* หัวหมวด: เหลือชิปไอคอนสีกึ่งกลาง */
            #sidebarNav.sidebar-mini .menu-section-header{ justify-content:center !important; padding:7px 0 !important; margin:10px 0 !important; background:transparent !important; border-color:transparent !important; gap:0 !important; }
            #sidebarNav.sidebar-mini .menu-section-header .sec-chip{ margin:0 auto !important; }
            #sidebarNav.sidebar-mini .menu-section-header .sec-label,
            #sidebarNav.sidebar-mini .menu-section-header .sec-chev{ display:none !important; }
            /* footer: เหลือไอคอนกึ่งกลาง */
            #sidebarNav.sidebar-mini .sidebar-footer-label{ display:none !important; }
            #sidebarNav.sidebar-mini .sidebar-footer-btn{ justify-content:center !important; padding:10px 0 !important; width:auto !important; }
            #sidebarNav.sidebar-mini .sidebar-footer-btn:hover,
            #sidebarNav.sidebar-mini button[class*="hover:bg-"]:hover{ background:transparent !important; background-color:transparent !important; border-color:transparent !important; box-shadow:none !important; }
            #sidebarNav.sidebar-mini .sidebar-footer-btn .footer-chip{ margin:0 !important; }
        }
        .sidebar-footer-btn:hover .footer-chip{ filter:brightness(1.35); transform:translateY(-1px); }
        /* 🗂️ พับหมวดเมนู */
        #menu-list .group-collapsed{ display:none !important; }
        #menu-list .menu-section-header.collapsed .sec-chev{ transform:rotate(-90deg); }
    </style>

    <script>
    // ═══ ระบบเมนู: พับหมวด + ยุบแถบ + แผงลอย (เขียนรวมก้อนเดียว) ═══
    (function() {
        function cleanLabel(btn) {
            const c = btn.cloneNode(true);
            c.querySelectorAll('.material-icons, [class*="rounded-full"]').forEach(function(x) { x.remove(); });
            return (c.textContent || '').trim().replace(/\s+/g, ' ');
        }
        let flyEl = null, flyHideT = null;
        function hideFlySoon() {
            clearTimeout(flyHideT);
            flyHideT = setTimeout(function() { if (flyEl) flyEl.style.display = 'none'; }, 200);
        }
        function showFly(h) {
            const nav = document.getElementById('sidebarNav');
            if (!nav || !nav.classList.contains('sidebar-mini')) return;
            clearTimeout(flyHideT);
            if (!flyEl) {
                flyEl = document.createElement('div');
                flyEl.style.cssText = 'position:fixed;z-index:99;min-width:215px;background:linear-gradient(165deg,#101828,#0b111e);border:1px solid rgba(255,255,255,0.1);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,0.55);padding:8px;display:none';
                flyEl.addEventListener('mouseenter', function() { clearTimeout(flyHideT); });
                flyEl.addEventListener('mouseleave', hideFlySoon);
                document.body.appendChild(flyEl);
            }
            const items = [];
            let el = h.nextElementSibling;
            while (el && !el.classList.contains('menu-section-header')) {
                const btns = el.tagName === 'BUTTON' ? [el] : Array.prototype.slice.call(el.querySelectorAll('button'));
                btns.forEach(function(b) {
                    if (b.classList.contains('hidden') || b.style.display === 'none') return;
                    if ((b.getAttribute('onclick') || '').indexOf('toggleSubMenu') !== -1) return;
                    const label = cleanLabel(b);
                    if (label) items.push({ label: label, target: b });
                });
                el = el.nextElementSibling;
            }
            if (!items.length) return;
            const titleEl = h.querySelector('.sec-label');
            const iconEl = h.querySelector('.sec-chip .material-icons');
            const color = iconEl ? getComputedStyle(iconEl).color : '#8fa3bf';
            flyEl.innerHTML =
                '<div style="padding:7px 10px 8px;font-size:11px;font-weight:900;letter-spacing:0.05em;color:' + color + ';border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:5px">' + (titleEl ? titleEl.textContent : '') + '</div>' +
                items.map(function(it, i) {
                    return '<button data-fi="' + i + '" style="width:100%;text-align:left;padding:9px 12px;border:none;border-radius:9px;background:transparent;color:#c9d3e0;font-size:13px;font-weight:700;cursor:pointer;display:block;transition:all .12s">' + it.label + '</button>';
                }).join('');
            flyEl.querySelectorAll('button[data-fi]').forEach(function(b) {
                b.addEventListener('mouseenter', function() { b.style.background = 'rgba(255,255,255,0.07)'; b.style.color = '#fff'; });
                b.addEventListener('mouseleave', function() { b.style.background = 'transparent'; b.style.color = '#c9d3e0'; });
                b.addEventListener('click', function() { items[+b.dataset.fi].target.click(); flyEl.style.display = 'none'; });
            });
            const r = h.getBoundingClientRect();
            flyEl.style.display = 'block';
            flyEl.style.left = (r.right + 10) + 'px';
            flyEl.style.top = r.top + 'px';
            requestAnimationFrame(function() {
                const fr = flyEl.getBoundingClientRect();
                if (fr.bottom > window.innerHeight - 8) flyEl.style.top = Math.max(8, window.innerHeight - fr.height - 8) + 'px';
            });
        }
        window.toggleMenuSection = function(h) {
            const nav = document.getElementById('sidebarNav');
            if (nav && nav.classList.contains('sidebar-mini')) { showFly(h); return; }
            const collapsed = !h.classList.contains('collapsed');
            h.classList.toggle('collapsed', collapsed);
            let el = h.nextElementSibling;
            while (el && !el.classList.contains('menu-section-header')) {
                el.classList.toggle('group-collapsed', collapsed);
                el = el.nextElementSibling;
            }
            try { localStorage.setItem('menuSec_' + h.dataset.sec, collapsed ? '1' : '0'); } catch (e) {}
        };
        window.toggleSidebarMini = function() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            const mini = !nav.classList.contains('sidebar-mini');
            nav.classList.toggle('sidebar-mini', mini);
            const ic = document.getElementById('sidebarCollapseIcon');
            if (ic) ic.textContent = mini ? 'chevron_right' : 'chevron_left';
            if (!mini && flyEl) flyEl.style.display = 'none';
            try { localStorage.setItem('sidebarMini', mini ? '1' : '0'); } catch (e) {}
        };
        document.addEventListener('DOMContentLoaded', function() {
            try {
                if (localStorage.getItem('sidebarMini') === '1') window.toggleSidebarMini();
                document.querySelectorAll('#menu-list .menu-section-header').forEach(function(h) {
                    if (localStorage.getItem('menuSec_' + h.dataset.sec) === '1') {
                        h.classList.add('collapsed');
                        let el = h.nextElementSibling;
                        while (el && !el.classList.contains('menu-section-header')) {
                            el.classList.add('group-collapsed');
                            el = el.nextElementSibling;
                        }
                    }
                });
            } catch (e) {}
            document.querySelectorAll('#menu-list .menu-section-header').forEach(function(h) {
                h.addEventListener('mouseenter', function() { showFly(h); });
                h.addEventListener('mouseleave', hideFlySoon);
            });
            document.querySelectorAll('#menu-list .nm-menu-title').forEach(function(b) {
                if (!b.title) b.title = cleanLabel(b);
            });
        });
    })();
    </script>
