<div id="bellApp" class="fade-in flex flex-col min-h-full bg-slate-50 dark:bg-slate-900 pb-10">

    <!-- Header -->
    <div class="bg-gradient-to-r from-amber-600 to-yellow-600 text-white p-4 shadow-md shrink-0 flex justify-between items-center flex-wrap gap-2">
        <div class="flex items-center gap-3">
            <div class="bg-white/20 p-2 rounded-full"><span class="material-icons text-2xl">notifications_active</span></div>
            <div>
                <h1 class="font-bold text-lg">กระดิ่งเรียกพนักงาน</h1>
                <p class="text-xs text-amber-100">กดเรียก → เครื่องพนักงานเด้งป็อปอัป + มีเสียง → พนักงานกดยืนยัน</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="bellBtnRingAll" onclick="bell_ringAll()" class="bg-rose-500 hover:bg-rose-400 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-1 transition shadow">
                <span class="material-icons text-sm">campaign</span> เรียกทั้งหมด
            </button>
            <button id="bellBtnHistory" onclick="bell_showHistory()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-1 transition shadow">
                <span class="material-icons text-sm">history</span> ประวัติ
            </button>
        </div>
    </div>

    <!-- Status bar -->
    <div id="bellStatus" class="hidden mx-4 mt-3 p-3 rounded-xl text-sm font-bold text-center"></div>

    <div class="p-4 max-w-5xl mx-auto w-full">

        <!-- การ์ดนับสถานะ -->
        <div class="grid grid-cols-3 gap-3 mb-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm p-4 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400">ออนไลน์</div>
                <div id="bellCountOnline" class="text-2xl font-extrabold text-emerald-500">0</div>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm p-4 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400">รอยืนยัน</div>
                <div id="bellCountWaiting" class="text-2xl font-extrabold text-amber-500">0</div>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm p-4 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400">ยืนยันแล้ว</div>
                <div id="bellCountConfirmed" class="text-2xl font-extrabold text-blue-500">0</div>
            </div>
        </div>

        <!-- การ์ดรายชื่อพนักงานออนไลน์ -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm overflow-hidden">
            <div class="bg-slate-50 dark:bg-slate-900 px-4 py-3 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center flex-wrap gap-2">
                <h2 class="font-bold text-slate-700 dark:text-white flex items-center gap-2">
                    <span class="material-icons text-emerald-500 text-sm">groups</span> พนักงานที่เปิดแอปอยู่
                </h2>
                <div id="bellRingControls" class="flex gap-2 items-center">
                    <label class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1 cursor-pointer select-none">
                        <input type="checkbox" id="bellSelectAll" onchange="bell_toggleSelectAll(this)" class="accent-amber-500"> เลือกทั้งหมด
                    </label>
                    <button id="bellBtnRingSel" onclick="bell_ringSelected()" class="bg-amber-500 hover:bg-amber-400 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1">
                        <span class="material-icons text-xs">notifications_active</span> เรียกที่เลือก
                    </button>
                </div>
            </div>
            <div id="bellList" class="p-3 space-y-2 min-h-[120px]">
                <div class="text-center text-slate-400 py-8 text-sm">กำลังโหลด...</div>
            </div>
        </div>

        <p class="text-xs text-slate-400 dark:text-slate-500 mt-3 text-center">
            💡 "ออนไลน์" คือพนักงานที่เปิดแอปกระดิ่งบนเครื่องอยู่ — ถ้าปิดแอปจะหายไปจากรายการใน 1 นาที
        </p>
    </div>
</div>
