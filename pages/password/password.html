<div id="pwdApp" class="fade-in pw-app">
<style>
.pw-app{--a:#f59e0b;color:var(--k-tx);background:var(--k-bg);min-height:100%;display:flex;flex-direction:column;border-radius:18px;border:1px solid var(--k-line);overflow:hidden}
.pw-app .material-icons{font-size:18px}
.pw-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--k-panel);border-bottom:1px solid var(--k-line)}
.pw-logo{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1b1406;flex:none;box-shadow:0 8px 22px rgba(245,158,11,.3)}
.pw-logo .material-icons{font-size:24px}
.pw-title{margin:0;font-size:19px;font-weight:900;color:var(--k-tx-strong);line-height:1.25}
.pw-sub{font-size:12.5px;font-weight:700;color:var(--k-mute);margin-top:1px;display:flex;align-items:center;gap:5px}
.pw-sub .material-icons{font-size:14px;color:var(--k-green-tx)}
.pw-hr{margin-left:auto;display:flex;gap:8px}
.pw-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:800;white-space:nowrap;border:1px solid var(--k-line3);background:var(--k-btn);color:var(--k-tx2);transition:background .15s,color .15s,filter .15s}
.pw-btn:hover{background:var(--k-btn-h);color:var(--k-tx-strong)}
.pw-btn.pri{background:linear-gradient(135deg,#fbbf24,#f59e0b);border-color:transparent;color:#1b1406;box-shadow:0 6px 16px rgba(245,158,11,.28)}
.pw-btn.pri:hover{filter:brightness(1.06);color:#1b1406}
.pw-btn .material-icons{font-size:17px}
.pw-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px 0;max-width:1400px;width:100%;margin:0 auto;box-sizing:border-box}
.pw-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--k-field);border:1px solid var(--k-line3)}
.pw-search:focus-within{border-color:var(--a);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.pw-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--k-tx-strong);font-size:13.5px;font-weight:600}
.pw-search .material-icons{color:var(--k-mute2)}
#pwdManagerControls:not(.hidden){display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:12px;background:var(--k-sunk);border:1px solid var(--k-line)}
#pwdManagerControls .lbl{font-size:12px;font-weight:800;color:var(--k-mute);display:flex;align-items:center;gap:5px}
#pwdUserFilter{height:32px;padding:0 8px;border-radius:9px;background:var(--k-field);border:1px solid var(--k-line3);color:var(--k-tx-strong);font-size:12.5px;font-weight:800;outline:none;min-width:150px}
.pw-body{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:14px 20px 40px;box-sizing:border-box}
#pwdGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pw-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--k-panel);border:1px solid var(--k-line);box-shadow:var(--k-shadow);transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.pw-card:hover{transform:translateY(-2px);border-color:rgba(245,158,11,.45);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.pw-top{display:flex;align-items:center;gap:12px;min-width:0}
.pw-av{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;font-weight:900;color:#fff;background:var(--c)}
.pw-tt{flex:1;min-width:0}
.pw-name{font-size:15px;font-weight:900;color:var(--k-tx-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-url{display:inline-flex;align-items:center;gap:3px;max-width:100%;font-size:11.5px;font-weight:700;color:#3b82f6;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-url:hover{text-decoration:underline}
.pw-url .material-icons{font-size:12px}
.pw-nourl{font-size:11.5px;font-weight:700;color:var(--k-mute2)}
.pw-owner{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--k-sunk);color:var(--k-tx3);border:1px solid var(--k-line);margin-top:3px}
.pw-owner .material-icons{font-size:11px}
.pw-fields{display:flex;flex-direction:column;border-radius:13px;background:var(--k-sunk);border:1px solid var(--k-line);overflow:hidden}
.pw-f{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;min-width:0}
.pw-f + .pw-f{border-top:1px solid var(--k-line)}
.pw-f > small{width:36px;flex:none;font-size:11px;font-weight:800;color:var(--k-mute)}
.pw-v{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:800;color:var(--k-tx-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-v.pass{color:var(--k-amber-tx);letter-spacing:.06em}
.pw-v.pass.masked{letter-spacing:.18em;color:var(--k-mute)}
.pw-ib{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--k-mute);transition:background .12s,color .12s}
.pw-ib:hover{background:var(--k-panel);color:var(--k-tx-strong)}
.pw-ib.ok{color:var(--k-green-tx)}
.pw-ib .material-icons{font-size:16px}
.pw-foot{display:flex;align-items:center;gap:6px}
.pw-date{font-size:11px;font-weight:700;color:var(--k-mute2);margin-right:auto}
.pw-act{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:800;color:var(--k-tx3);border:1px solid var(--k-line2);background:transparent}
.pw-act:hover{background:var(--k-btn-h);color:var(--k-tx-strong)}
.pw-act.del:hover{background:var(--k-red-bg);color:var(--k-red-tx);border-color:rgba(239,68,68,.35)}
.pw-act .material-icons{font-size:15px}
.pw-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:70px 16px;text-align:center;color:var(--k-mute2);font-size:13px;font-weight:700}
.pw-empty .material-icons{font-size:50px;opacity:.45}
.pw-empty b{font-size:15px;color:var(--k-tx3)}
#pwdPagination{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:22px 0 10px}
.pw-pg{min-width:34px;height:34px;padding:0 10px;border-radius:10px;font-size:12.5px;font-weight:800;border:1px solid var(--k-line2);background:var(--k-panel);color:var(--k-tx2)}
.pw-pg:hover:not(:disabled){border-color:var(--a)}
.pw-pg.on{background:linear-gradient(135deg,#fbbf24,#f59e0b);border-color:transparent;color:#1b1406}
.pw-pg:disabled{opacity:.4}
.pw-pginfo{font-size:12px;font-weight:700;color:var(--k-mute);margin-right:6px}
#pwdModal .pm-box{width:100%;max-width:480px;border-radius:20px;overflow:hidden;background:var(--k-panel);border:1px solid var(--k-line3);box-shadow:0 24px 60px rgba(0,0,0,.45);color:var(--k-tx)}
#pwdModal .pm-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--k-line)}
#pwdModal .pm-h h3{margin:0 auto 0 0;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:900;color:var(--k-tx-strong)}
#pwdModal .pm-h h3 .material-icons{color:#f59e0b}
#pwdModal .pm-x{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--k-mute)}
#pwdModal .pm-x:hover{background:var(--k-btn-h);color:var(--k-tx-strong)}
#pwdModal form{padding:16px 18px 18px;display:flex;flex-direction:column;gap:13px}
#pwdModal label.pm-l{display:block;font-size:12.5px;font-weight:800;color:var(--k-tx3);margin-bottom:6px}
#pwdModal label.pm-l small{font-weight:700;color:var(--k-mute2)}
#pwdModal .pm-in{width:100%;box-sizing:border-box;height:42px;padding:0 12px;border-radius:12px;background:var(--k-field);border:1px solid var(--k-line3);color:var(--k-tx-strong);font-size:14px;font-weight:700;outline:none}
#pwdModal .pm-in:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16)}
#pwdModal .pm-mono{font-family:ui-monospace,monospace;font-size:13px}
#pwdModal .pm-pw{position:relative}
#pwdModal .pm-pw .pm-in{padding-right:76px}
#pwdModal .pm-pw .pm-tools{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
#pwdModal .pm-tools button{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--k-mute)}
#pwdModal .pm-tools button:hover{background:var(--k-btn-h);color:#f59e0b}
#pwdModal .pm-meter{height:6px;border-radius:99px;background:var(--k-sunk);overflow:hidden;margin-top:8px}
#pwdStrengthLabel{display:block;margin-top:4px;font-size:11px;font-weight:800;color:var(--k-tx3)}
#pwdModal .pm-save{height:46px;border-radius:13px;font-size:15px;font-weight:900;color:#1b1406;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 8px 20px rgba(245,158,11,.25)}
#pwdModal .pm-save:hover{filter:brightness(1.06)}
@media (max-width:640px){ .pw-head,.pw-bar,.pw-body{padding-left:12px;padding-right:12px} #pwdGrid{grid-template-columns:1fr} .pw-btn .pw-t{display:none} }
</style>
    <div class="pw-head">
        <div class="pw-logo"><span class="material-icons">vpn_key</span></div>
        <div>
            <h1 class="pw-title">จัดการรหัสผ่าน</h1>
            <div class="pw-sub" id="pwdStatLine"><span class="material-icons">shield</span>เก็บรหัสผ่านของคุณ · รหัสจะแสดงเมื่อกดดูเท่านั้น</div>
        </div>
        <div class="pw-hr">
            <button onclick="openAddPwdModal()" class="pw-btn pri"><span class="material-icons">add</span>เพิ่มรหัสผ่าน</button>
            <button onclick="showPage('dashboard')" class="pw-btn"><span class="material-icons">arrow_back</span><span class="pw-t">กลับ</span></button>
        </div>
    </div>
    <span id="pwdStaffLabel" class="hidden"></span>
    <div class="pw-bar">
        <label class="pw-search"><span class="material-icons">search</span><input type="text" id="pwdSearchInput" oninput="filterPwdCards()" placeholder="ค้นหาชื่อเว็บ / ยูสเซอร์ / ลิงก์" aria-label="ค้นหารหัสผ่าน"></label>
        <div id="pwdManagerControls" class="hidden">
            <span class="lbl"><span class="material-icons" style="font-size:16px">person_search</span>ดูรหัสของ</span>
            <select id="pwdUserFilter" onchange="fetchPasswords(true)" aria-label="เลือกพนักงาน"><option value="all">ทุกคน</option></select>
        </div>
    </div>
    <div class="pw-body">
        <div id="pwdGrid"></div>
        <div id="pwdPagination"></div>
    </div>
</div>

<div id="pwdModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 fade-in" style="background:rgba(2,6,23,.62);backdrop-filter:blur(4px)">
    <div class="pm-box">
        <div class="pm-h">
            <h3 id="pwdModalTitle"><span class="material-icons">vpn_key</span>บันทึกรหัสผ่าน</h3>
            <button type="button" class="pm-x" onclick="closePwdModal()" aria-label="ปิด"><span class="material-icons">close</span></button>
        </div>
        <form onsubmit="savePassword(event)" autocomplete="off">
            <input type="hidden" id="pwdEditId" value="">
            <div><label class="pm-l" for="pwdSite">ชื่อเว็บ / รายการ</label><input type="text" id="pwdSite" required maxlength="120" placeholder="เช่น Facebook, หลังบ้าน Jun88" class="pm-in"></div>
            <div><label class="pm-l" for="pwdUrl">ลิงก์เว็บ <small>(ไม่บังคับ)</small></label><input type="text" id="pwdUrl" maxlength="500" placeholder="https://..." class="pm-in pm-mono"></div>
            <div><label class="pm-l" for="pwdUser">Username</label><input type="text" id="pwdUser" maxlength="200" placeholder="ชื่อผู้ใช้" class="pm-in pm-mono"></div>
            <div>
                <label class="pm-l" for="pwdPass">Password</label>
                <div class="pm-pw">
                    <input type="text" id="pwdPass" required maxlength="300" placeholder="รหัสผ่าน" oninput="checkPwdStrength(this.value)" class="pm-in pm-mono">
                    <div class="pm-tools">
                        <button type="button" onclick="generatePassword()" title="สุ่มรหัสผ่านแข็งแรง" aria-label="สุ่มรหัสผ่าน"><span class="material-icons">casino</span></button>
                        <button type="button" onclick="copyText(document.getElementById('pwdPass').value)" title="คัดลอก" aria-label="คัดลอกรหัสผ่าน"><span class="material-icons">content_copy</span></button>
                    </div>
                </div>
                <div class="pm-meter"><div id="pwdStrengthBar" style="height:100%;width:0%;background:#ef4444;border-radius:99px;transition:width .3s,background .3s"></div></div>
                <span id="pwdStrengthLabel"></span>
            </div>
            <button type="submit" class="pm-save" id="pwdSaveBtn">บันทึก</button>
        </form>
    </div>
</div>
