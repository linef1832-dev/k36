<div id="ipCheckPage" class="ipn-page">
<style>
.ipn-page{color:var(--k-tx);max-width:1600px;margin:0 auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:14px}
.ipn-page .material-icons{font-size:18px}
.ipn-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:18px;background:var(--k-panel);border:1px solid var(--k-line);box-shadow:var(--k-shadow)}
.ipn-logo{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#0ea5e9;color:#fff;flex:none;box-shadow:0 8px 20px rgba(14,165,233,.28)}
.ipn-logo .material-icons{font-size:24px}
.ipn-title{margin:0;font-size:19px;font-weight:900;color:var(--k-tx-strong)}
.ipn-sub{font-size:12.5px;font-weight:700;color:var(--k-mute);margin-top:1px}
.ipn-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ipn-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:11px;font-size:13px;font-weight:800;border:1px solid var(--k-line3);background:var(--k-btn);color:var(--k-tx2);white-space:nowrap;transition:background .15s,color .15s}
.ipn-btn:hover{background:var(--k-btn-h);color:var(--k-tx-strong)}
.ipn-btn.pri{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
.ipn-btn.pri:hover{filter:brightness(1.07)}
.ipn-btn.dng:hover{background:var(--k-red-bg);color:var(--k-red-tx)}
.ipn-stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ipn-stat{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:15px;background:var(--k-panel);border:1px solid var(--k-line)}
.ipn-stat > .material-icons{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-size:19px;flex:none}
.ipn-stat b{display:block;font-size:21px;font-weight:900;color:var(--k-tx-strong);font-variant-numeric:tabular-nums;line-height:1.1}
.ipn-stat small{font-size:11.5px;font-weight:700;color:var(--k-mute)}
#ipAlertBanner:empty{display:none}
.ipn-alerts{border-radius:16px;background:var(--k-panel);border:1px solid var(--k-line);overflow:hidden}
.ipn-alerts-h{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:13.5px;font-weight:800;color:var(--k-tx-strong);border-bottom:1px solid var(--k-line)}
.ipn-alerts-h .material-icons{color:#ef4444}
.ipn-alerts-h small{margin-left:auto;font-size:11px;font-weight:700;color:var(--k-mute)}
.ipn-alerts-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding:10px}
.ipn-alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-align:left;border:1px solid var(--bc);background:color-mix(in srgb,var(--ac) 9%,var(--k-panel));min-width:0;width:100%;cursor:pointer;transition:transform .12s}
.ipn-alert:hover{transform:translateY(-1px)}
.ipn-alert > .material-icons{color:var(--ac);font-size:20px;flex:none}
.ipn-alert div{flex:1;min-width:0;display:flex;flex-direction:column}
.ipn-alert b{font-size:13px;font-weight:800;color:var(--k-tx-strong)}
.ipn-alert small{font-size:11.5px;font-weight:700;color:var(--k-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipn-alert .ipn-go{font-size:16px;color:var(--k-mute2)}
.ipn-alert.crit{--ac:#ef4444;--bc:rgba(239,68,68,.4)}
.ipn-alert.high{--ac:#f97316;--bc:rgba(249,115,22,.4)}
.ipn-alert.med{--ac:#eab308;--bc:rgba(234,179,8,.4)}
.ipn-alert.ok{--ac:#10b981;--bc:rgba(16,185,129,.4);cursor:default}
.ipn-alert.ok:hover{transform:none}
.ipn-body{display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px;align-items:start}
.ipn-nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:16px;background:var(--k-panel);border:1px solid var(--k-line)}
.ipn-grp{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--k-mute2);padding:10px 8px 4px}
.ipn-grp:first-child{padding-top:2px}
.ipn-nav .ip-tab-btn{display:flex!important;align-items:center;gap:9px;width:100%;padding:8px 10px!important;border-radius:10px!important;font-size:13px!important;font-weight:700!important;color:var(--k-tx3)!important;background:transparent!important;border:0!important;box-shadow:none!important;text-align:left;transition:background .12s,color .12s}
.ipn-nav .ip-tab-btn:hover{background:var(--k-btn-h)!important;color:var(--k-tx-strong)!important}
.ipn-nav .ip-tab-btn.ipn-on{background:rgba(14,165,233,.14)!important;color:var(--k-tx-strong)!important;font-weight:900!important}
.ipn-nav .ip-tab-btn.ipn-on .material-icons{color:#0ea5e9}
.ipn-nav .ip-tab-btn .material-icons{font-size:18px;color:var(--k-mute)}
.ipn-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipn-badge{font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:999px;background:rgba(239,68,68,.15);color:var(--k-red-tx)}
.ipn-badge:empty{display:none}
.ipn-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.ipn-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-radius:14px;background:var(--k-panel);border:1px solid var(--k-line)}
.ipn-bar select,.ipn-search{height:38px;border-radius:10px;background:var(--k-field);border:1px solid var(--k-line3);color:var(--k-tx-strong);font-size:13px;font-weight:700}
.ipn-bar select{padding:0 10px;min-width:170px;outline:none}
.ipn-search{flex:1;min-width:200px;display:flex;align-items:center;gap:7px;padding:0 11px}
.ipn-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--k-tx-strong);font-size:13px;font-weight:600}
.ipn-search .material-icons{color:var(--k-mute2)}
#ipLogsContainer{min-width:0}
#ipLogsContainer td .rounded-full{white-space:nowrap}
#ipLogsContainer table{background:var(--k-panel)!important;border-radius:14px}
#ipLogsContainer table thead{background:var(--k-sunk)!important;color:var(--k-mute)!important}
#ipLogsContainer table thead th{font-size:11.5px;font-weight:900;letter-spacing:.02em}
#ipLogsContainer table tbody tr{border-color:var(--k-line)!important}
#ipLogsContainer .overflow-x-auto{border:1px solid var(--k-line);border-radius:14px;box-shadow:none!important}
@media (max-width:1200px){ .ipn-stats{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:900px){ .ipn-body{grid-template-columns:1fr} .ipn-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:4px} .ipn-grp{width:100%;padding:6px 6px 2px} .ipn-nav .ip-tab-btn{width:auto} }
@media (max-width:560px){ .ipn-page{padding:12px 10px 30px} .ipn-stats{grid-template-columns:repeat(2,minmax(0,1fr))} .ipn-acts{width:100%} .ipn-acts .ipn-btn{flex:1;justify-content:center} }
</style>
