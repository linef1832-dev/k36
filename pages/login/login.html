<style>
/* ========================================================
   Clean Access — หน้า Login โทนขาว-เทาเรียบหรู แบบ Apple/ธนาคาร
   ======================================================== */
@keyframes caRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes caShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes caPinOk{0%{transform:scale(1)}35%{transform:scale(1.08)}70%{transform:scale(0.97)}100%{transform:scale(1)}}

#loginScreen{background:#f4f5f7}

.ca-card{position:relative;width:100%;max-width:22rem;animation:caRise 0.5s cubic-bezier(0.16,1,0.3,1) both;z-index:10}
.ca-card-body{position:relative;border-radius:20px;background:#ffffff;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 1px 2px rgba(0,0,0,0.03),0 20px 44px -12px rgba(20,20,30,0.12);
    padding:2.5rem 2.1rem 2.1rem}

.ca-logo{width:52px;height:52px;margin:0 auto 1.25rem;border-radius:15px;position:relative;
    background:linear-gradient(150deg,#1a1d24,#0c0d11);
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -6px rgba(20,20,30,0.35)}

.ca-title{text-align:center;font-size:17px;font-weight:800;color:#111318;letter-spacing:-0.01em;margin-bottom:4px}
.ca-subtitle{text-align:center;font-size:12.5px;color:#8b8f99;font-weight:500;margin-bottom:1.9rem}

.ca-label{font-size:11.5px;font-weight:700;color:#6b6f79;margin-bottom:7px;display:block;letter-spacing:0.01em}

.ca-field{position:relative;margin-bottom:1.3rem}
.ca-field .material-icons{position:absolute;left:14px;top:calc(50% + 11px);transform:translateY(-50%);font-size:17px;color:#a7abb5;pointer-events:none}
.ca-input{width:100%;padding:12.5px 14px 12.5px 42px;border-radius:12px;
    background:#f7f8fa;border:1.5px solid #e7e8ec;
    color:#16181d;font-weight:600;font-size:14.5px;outline:none;transition:all 0.16s}
.ca-input::placeholder{color:#adb0b9}
.ca-input:focus{border-color:#111318;background:#ffffff;box-shadow:0 0 0 3.5px rgba(17,19,24,0.07)}

.ca-divider{margin:0.4rem 0 1rem}

.ca-pin-row{display:flex;justify-content:space-between;gap:7px}
.ca-pin{flex:1;min-width:0;height:52px;border-radius:12px;text-align:center;outline:none;
    background:#f7f8fa;border:1.5px solid #e7e8ec;
    color:#111318;font-size:20px;font-weight:800;caret-color:transparent;transition:all 0.16s}
.ca-pin:focus{border-color:#111318;background:#ffffff;box-shadow:0 0 0 3.5px rgba(17,19,24,0.07);transform:translateY(-1px)}
.ca-pin.ca-filled{border-color:#c8ac5c;background:#fdfaf3}
.ca-pin.ca-success{border-color:#1fa971!important;background:#eefbf5!important;box-shadow:0 0 0 3.5px rgba(31,169,113,0.14)!important;animation:caPinOk 0.4s ease}
.ca-pin.ca-error{border-color:#e0454b!important;background:#fdefee!important}

.ca-hint{font-size:11px;color:#a7abb5;text-align:center;margin-top:12px}

.ca-remember{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    color:#6b6f79;font-size:12.5px;font-weight:600;user-select:none;margin-top:1.5rem}
.ca-checkbox{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    background:#f7f8fa;border:1.5px solid #d7d9df;transition:all 0.16s;flex-shrink:0}
.ca-checkbox .material-icons{font-size:12px;color:#fff;opacity:0;transition:opacity 0.14s}

.ca-shake{animation:caShake 0.4s ease}

.ca-footer{margin-top:1.6rem;text-align:center}
.ca-footer span{font-size:10.5px;color:#b3b6bf;font-weight:600;letter-spacing:0.04em}
</style>

<div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4">

    <div class="ca-card" id="loginCard">
        <div class="ca-card-body">

            <div class="ca-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L20 6V12C20 17 16.5 20.5 12 22C7.5 20.5 4 17 4 12V6L12 2Z" stroke="#ffffff" stroke-width="1.5" fill="none"/>
                    <path d="M9 12L11 14L15.5 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="ca-title">เข้าสู่ระบบ</div>
            <div class="ca-subtitle">กรอกชื่อและรหัส PIN ของคุณ</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="ca-field">
                    <label class="ca-label">ชื่อพนักงาน</label>
                    <span class="material-icons">person_outline</span>
                    <input type="text" id="loginName" name="username" placeholder="พิมพ์ชื่อผู้ใช้งาน" required autocomplete="username" class="ca-input">
                </div>

                <label class="ca-label" style="display:block;margin-bottom:9px">รหัส PIN 6 หลัก</label>
                <div id="pinInputs" class="ca-pin-row" onpaste="handlePinPaste(event)">
                    <input type="password" maxlength="1" inputmode="numeric" class="pin-box ca-pin">
                    <input type="password" maxlength="1" inputmode="numeric" class="pin-box ca-pin">
                    <input type="password" maxlength="1" inputmode="numeric" class="pin-box ca-pin">
                    <input type="password" maxlength="1" inputmode="numeric" class="pin-box ca-pin">
                    <input type="password" maxlength="1" inputmode="numeric" class="pin-box ca-pin">
                    <input type="password" maxlength="1" inputmode="numeric" class="pin-box ca-pin">
                </div>
                <p class="ca-hint">พิมพ์ครบ 6 หลัก ระบบจะเข้าสู่หน้าหลักอัตโนมัติ</p>

                <label class="ca-remember">
                    <input type="checkbox" id="rememberMe" class="sr-only">
                    <div class="ca-checkbox" id="rememberBox">
                        <span class="material-icons" id="checkIcon">check</span>
                    </div>
                    จำชื่อฉันไว้ในเครื่องนี้
                </label>

                <button type="submit" id="hiddenSubmitBtn" class="hidden">Submit</button>
            </form>

            <div class="ca-footer"><span>SECURE LOGIN</span></div>
        </div>
    </div>
</div>

<script>
// ========== PIN: แต้มสีเมื่อพิมพ์ ==========
document.querySelectorAll('.pin-box').forEach(inp=>{
    inp.addEventListener('input',()=>{
        if(inp.value) inp.classList.add('ca-filled');
        else inp.classList.remove('ca-filled');
    });
});

// ========== จำชื่อฉันไว้ ==========
document.getElementById('rememberMe')?.addEventListener('change',function(){
    const icon=document.getElementById('checkIcon'),box=document.getElementById('rememberBox');
    if(this.checked){
        icon.style.opacity='1';
        box.style.background='#111318';
        box.style.borderColor='#111318';
    }else{
        icon.style.opacity='0';
        box.style.background='#f7f8fa';
        box.style.borderColor='#d7d9df';
    }
});

// ========== เขย่าการ์ด + PIN แดงตอนผิดพลาด (auth.js เรียกใช้ถ้ามี) ==========
window.shakeLoginCard = function(){
    const card=document.getElementById('loginCard');
    if(!card) return;
    card.classList.remove('ca-shake');
    void card.offsetWidth;
    card.classList.add('ca-shake');
    setTimeout(()=>card.classList.remove('ca-shake'),450);
    document.querySelectorAll('.pin-box').forEach(p=>{
        p.classList.add('ca-error');
        setTimeout(()=>p.classList.remove('ca-error'),650);
    });
};

// ========== PIN เขียวตอนสำเร็จ (auth.js เรียกใช้ถ้ามี) ==========
window.pinSuccessAnim = function(){
    document.querySelectorAll('.pin-box').forEach(p=>{
        p.classList.add('ca-success');
    });
};

// ========== เสียงตอบสนองเบาๆ ==========
(function(){
    let audioCtx = null;
    function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
    function beep(freq=880, dur=0.05, vol=0.06, type='sine'){
        try{
            const ctx=getCtx();
            const osc=ctx.createOscillator();
            const gain=ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type=type; osc.frequency.value=freq;
            gain.gain.setValueAtTime(vol,ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime+dur);
        }catch(e){}
    }
    document.querySelectorAll('.pin-box').forEach((inp,i)=>{
        inp.addEventListener('input',()=>{ if(inp.value) beep(560+i*35,0.04,0.05,'sine'); });
    });
    window._loginBeepError = ()=>{ beep(190,0.25,0.08,'sawtooth'); };
    window._loginBeepSuccess = ()=>{
        [600,800,1000].forEach((f,i)=>setTimeout(()=>beep(f,0.09,0.06,'sine'),i*75));
    };
})();
</script>
