<div id="oaApp" class="fade-in min-h-full bg-slate-50 dark:bg-slate-900 pb-10">

    <div class="px-4 md:px-5 max-w-5xl mx-auto w-full pt-5 space-y-4">
        
        <header class="oa-head">
            <div class="oa-head-top">
                <div class="oa-head-id">
                    <div class="oa-head-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.3-.6L3 21l1.6-4.4A7.9 7.9 0 0 1 3 11.5C3 7 7 3.1 12 3.1s9 3.9 9 8.4z"/><path d="M8.5 10.5v3M11 10.5v3M13.5 10.5v3h2"/></svg></div>

                        <h1 class="oa-head-title">ตรวจนับแชท LINE OA</h1>
                        <div class="oa-head-sub">
                            <span id="oaRangeLive" class="oa-head-range">วันนี้</span>
                            <span class="oa-live" id="oaLive"><i></i><span id="oaUpdated">กำลังโหลด…</span></span>
                        </div>
                    </div>
                </div>
                <div class="oa-head-actions">
                    <button id="oaBtnCsv" onclick="oa_exportCSV()" class="oa-hbtn" title="ดาวน์โหลดสรุปจำนวนแชท แยกตามกะและเว็บ (Excel)"><span class="material-icons">download</span><span>Excel</span></button>
                    <button onclick="showPage('dashboard')" class="oa-hbtn"><span class="material-icons">arrow_back</span><span>กลับ</span></button>
                </div>
            </div>
            <div class="oa-stats">
                <div class="oa-stat oa-stat-main"><div class="oa-stat-n" id="oaTotal">–</div><div class="oa-stat-l">แชทที่ตอบ</div></div>
                <div class="oa-stat"><div class="oa-stat-n" id="oaPeople">–</div><div class="oa-stat-l">พนักงานที่ตอบ</div></div>
                <div class="oa-stat"><div class="oa-stat-n" id="oaAvg">–</div><div class="oa-stat-l">เฉลี่ยต่อคน</div></div>
            </div>
        </header>
        
        <div class="oa-tabs">
            <button data-t="list" class="on" onclick="oa_setTab('list')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>รายการแชท</span>
            </button>
            <button data-t="rank" onclick="oa_setTab('rank')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                <span>จัดอันดับ</span>
            </button>
            <button data-t="act" onclick="oa_setTab('act')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span>ดำเนินการ</span>
            </button>
        </div>
        
        <div class="oa-panel oa-fp">
            <div class="oa-fp-top">
                <div class="oa-seg" id="oaRangeSeg">
                    <button data-r="today" onclick="oa_setRange('today')">วันนี้</button>
                    <button data-r="yesterday" onclick="oa_setRange('yesterday')">เมื่อวาน</button>
                    <button data-r="7d" onclick="oa_setRange('7d')">7 วัน</button>
                    <button data-r="month" onclick="oa_setRange('month')">เดือนนี้</button>
                </div>
                <div class="oa-fp-dates">
                    <span class="material-icons">event</span>

                    <span class="oa-fp-to">ถึง</span>
                    <input type="date" id="oaTo" class="oa-input" onchange="oa_setRange('custom')" aria-label="ถึงวันที่">
                </div>
                <div class="oa-search-wrap oa-fp-search">
                    <span class="material-icons oa-search-ic">search</span>
                    <input id="oaSearch" oninput="(window.oa_onSearch || window.oa_render)()" placeholder="ค้นหาชื่อพนักงาน หรือ ชื่อลูกค้า" class="oa-search-in">
                </div>
            </div>
            <div class="oa-filters oa-fp-grid">
                <div class="oa-fgroup oa-fbox"><div class="oa-flabel"><span class="material-icons">schedule</span>กะ</div><div id="oaShiftChips" class="oa-chipwrap"></div></div>
                <div class="oa-fgroup oa-fbox"><div class="oa-flabel"><span class="material-icons">groups</span>แผนก</div><div id="oaDeptChips" class="oa-chipwrap"></div></div>
                <div class="oa-fgroup oa-fbox oa-fwide"><div class="oa-flabel"><span class="material-icons">language</span>เว็บ</div><div id="oaSiteChips" class="oa-chipwrap"></div></div>
                <div class="oa-fgroup oa-fbox oa-fwide"><div class="oa-flabel"><span class="material-icons">forum</span>ไลน์ OA</div><div id="oaLineChips" class="oa-chipwrap"></div></div>
            </div>
            <div class="oa-activebar" id="oaActiveBar">
                <span class="oa-ab-l"><span class="material-icons">filter_alt</span>กำลังกรอง</span>
                <div id="oaActiveChips" class="oa-ab-chips"></div>
                <button id="oaClearF" onclick="oa_clearFilters()" class="oa-clearf" title="ล้างตัวกรองทั้งหมด" style="display:none"><span class="material-icons">close</span>ล้างทั้งหมด</button>
            </div>
        </div>
        
        <div id="oaViewList" class="oa-panel p-0 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-100 dark:border-slate-700 flex items-center justify-between">
                <div class="font-bold text-slate-700 dark:text-slate-200">รายการพนักงานที่ตอบ</div>
                <div class="text-xs font-semibold text-slate-400">เรียงจากตอบล่าสุด</div>
            </div>
            <div id="oaList" class="divide-y divide-gray-50 dark:divide-slate-700/50"><div class="text-center text-slate-400 py-12 text-sm">กำลังโหลด...</div></div>
        </div>
        
        <div id="oaViewRank" style="display:none" class="space-y-4">
            <div id="oaPodium" class="oa-podium"></div>
            <div class="oa-panel p-0 overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-100 dark:border-slate-700 font-bold text-slate-700 dark:text-slate-200">🏆 อันดับทั้งหมด</div>
                <div id="oaRankList" class="divide-y divide-gray-50 dark:divide-slate-700/50"></div>
            </div>
        </div>

        <div id="oaViewAct" style="display:none" class="space-y-4">
            <div class="oa-panel">
                <div class="relative mb-3">
                    <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-base">search</span>
                    <input id="oaActSearch" oninput="oa_renderAct()" placeholder="ค้นหาชื่อพนักงาน / ลูกค้า" class="oa-input w-full" style="padding-left:34px">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="oa-kpi"><div class="oa-kpi-n" id="oaActAdd" style="color:#059669">–</div><div class="oa-kpi-l">🟢 ยังค้าง</div></div>
                    <div class="oa-kpi"><div class="oa-kpi-n" id="oaActRem" style="color:#64748b">–</div><div class="oa-kpi-l">⚪ จบแล้ว</div></div>
                </div>
            </div>
            <div class="oa-panel p-0 overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-100 dark:border-slate-700 font-bold text-slate-700 dark:text-slate-200">ประวัติการกดดำเนินการ</div>
                <div id="oaActList" class="divide-y divide-gray-50 dark:divide-slate-700/50"></div>
            </div>
        </div>
    </div>
</div>

<style>

    #oaApp { --oa-line:6,199,85; }

    #oaApp .oa-head-logo { width:46px; height:46px; flex:none; border-radius:14px; display:flex; align-items:center; justify-content:center; background:#06C755; color:#fff; box-shadow:0 6px 16px rgba(var(--oa-line),.32); }

    #oaApp .oa-live { display:inline-flex; align-items:center; gap:6px; color:var(--k-mute); font-weight:600; font-size:12.5px; }
    #oaApp .oa-live i { width:7px; height:7px; border-radius:50%; background:#06C755; }
    #oaApp .oa-live.tick i { animation:oaPulse 1.2s ease-out 2; }
    #oaApp .oa-live.bad, #oaApp .oa-live.bad i { color:var(--k-amber-tx); }
    #oaApp .oa-live.bad i { background:var(--k-amber-tx); animation:none; }
    @keyframes oaPulse { 0% { box-shadow:0 0 0 0 rgba(var(--oa-line),.55); } 70%,100% { box-shadow:0 0 0 7px rgba(var(--oa-line),0); } }
    @media (prefers-reduced-motion:reduce){ #oaApp .oa-live i { animation:none; } }
    #oaApp .oa-head-actions { display:flex; gap:8px; }
    #oaApp .oa-hbtn { display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 14px; border-radius:11px; border:1px solid var(--k-line3); background:var(--k-btn); color:var(--k-tx2); font-weight:700; font-size:13px; cursor:pointer; transition:background .15s, border-color .15s; }
    #oaApp .oa-hbtn .material-icons { font-size:17px; }

    #oaApp .oa-hbtn:disabled { opacity:.6; cursor:progress; }
    #oaApp .oa-hbtn:focus-visible { outline:2px solid #06C755; outline-offset:2px; }
    #oaApp .oa-stats { display:grid; grid-template-columns:1.35fr 1fr 1fr; border-top:1px solid var(--k-line); background:color-mix(in srgb, var(--k-sunk) 70%, transparent); }
    #oaApp .oa-stat { padding:16px 20px 17px; min-width:0; }
    #oaApp .oa-stat + .oa-stat { border-left:1px solid var(--k-line); }
    #oaApp .oa-stat-n { font-size:28px; font-weight:800; line-height:1.05; color:var(--k-tx-strong); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
    #oaApp .oa-stat-main .oa-stat-n { font-size:38px; color:var(--k-green-tx); }
    #oaApp .oa-stat-l { margin-top:6px; font-size:12.5px; font-weight:700; color:var(--k-mute); }
    @media (max-width:640px){
        #oaApp .oa-head-top { padding:16px 14px 14px; flex-wrap:nowrap; align-items:flex-start; gap:10px; }
        #oaApp .oa-head-id { gap:11px; }
        #oaApp .oa-head-logo { width:40px; height:40px; border-radius:12px; }
        #oaApp .oa-head-logo svg { width:22px; height:22px; }

    #oaApp .oa-tabs { display:flex; gap:5px; background:#eef2f6; padding:5px; border-radius:16px; }
