<div id="galleryApp" class="fade-in gx-app">
<style>
/* ════════════════════════════════════════════════════
   🎩 คลังรูป V2 — ผังใหม่แบบแถบข้าง (Sidebar Studio)
   ซ้าย: หมวด/ตัวกรอง/ปุ่มงานทั้งหมด · ขวา: ค้นหาใหญ่ + รูปเต็มจอ
   id / onclick / template เดิมครบทุกตัว — ทุกระบบทำงานเหมือนเดิม
   ════════════════════════════════════════════════════ */
.gx-app{
    display:flex; height:100%; overflow:hidden; border-radius:22px;
    background:linear-gradient(180deg,#0c1424 0%,#0a0f1c 100%);
    border:1px solid rgba(232,193,90,0.14);
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 18px 60px -18px rgba(0,0,0,0.85);
}

/* ── 🧭 แถบข้างซ้าย ── */
.gx-side{
    width:212px; flex-shrink:0; display:flex; flex-direction:column; gap:6px;
    padding:14px 12px; overflow-y:auto;
    background:linear-gradient(180deg,#101a2e,#0a101d);
    border-right:1px solid rgba(232,193,90,0.18);
}
.gx-brand{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.gx-brand-icon{
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#f7e7b6,#E8C15A 55%,#c99a33);
    color:#3a2c07; box-shadow:0 6px 16px -6px rgba(232,193,90,0.7), inset 0 1px 0 rgba(255,255,255,0.6);
}
.gx-brand-icon .material-icons{ font-size:20px; }
.gx-brand-title{ font-size:15px; font-weight:900; color:#f1f5f9; line-height:1.1; }
.gx-brand-sub{ font-size:9px; color:#8b9bb4; margin-top:2px; }
.gx-side-label{
    font-size:9px; font-weight:900; color:#8b9bb4; letter-spacing:.12em;
    text-transform:uppercase; margin:10px 2px 4px; user-select:none;
}

/* หมวด (แนวตั้ง) */
.gx-tabs{ display:flex; flex-direction:column; gap:4px; }
.gx-tab{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:9px 11px; border-radius:11px; font-size:12.5px; font-weight:800;
    color:#94a3b8; background:transparent; border:1px solid transparent;
    cursor:pointer; transition:all .16s; white-space:nowrap;
}
.gx-tab:hover{ color:#e2e8f0; background:rgba(148,163,184,0.10); }
.gx-tab.on{
    color:#fff; background:var(--tc,#3b82f6); border-color:rgba(255,255,255,0.22);
    box-shadow:0 6px 16px -6px rgba(0,0,0,0.6), 0 0 18px -8px var(--tc,#3b82f6);
}

/* ตัวกรอง/ปุ่มในแถบข้าง */
.gx-select{
    width:100%; height:34px; border-radius:11px; padding:0 10px;
    font-size:12px; font-weight:700; cursor:pointer; outline:none;
    background:rgba(2,8,19,0.55); border:1px solid rgba(255,255,255,0.10); color:#e2e8f0;
    transition:border-color .15s, box-shadow .15s; margin-bottom:5px;
}
.gx-select:focus{ border-color:rgba(232,193,90,0.65); box-shadow:0 0 0 3px rgba(232,193,90,0.15); }
.gx-btn{
    width:100%; height:35px; border-radius:11px; margin-bottom:5px;
    font-size:11.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .15s, filter .15s; box-shadow:0 5px 14px -6px rgba(0,0,0,0.4); white-space:nowrap;
}
.gx-btn:hover{ transform:translateY(-1px); filter:brightness(1.08); }
.gx-btn:active{ transform:scale(0.97); }
.gx-btn .material-icons{ font-size:15px; }
.gx-btn-dl{ background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:1px solid rgba(255,255,255,0.2); }
#btnBulkDelete{ width:100%; height:35px; border-radius:11px; font-size:11.5px; margin-bottom:5px; justify-content:center; }
#adminUploadControls{ display:flex; flex-direction:column; gap:5px; }
#adminUploadControls.hidden{ display:none; }
#uploadCategory{
    width:100%; height:34px; border-radius:11px; font-size:12px; padding:0 10px;
    background:rgba(2,8,19,0.55); color:#f5e3ae; outline:none; cursor:pointer;
    border:1px solid rgba(232,193,90,0.4);
}
.gx-upload-label{
    width:100%; height:36px; border-radius:11px; cursor:pointer;
    font-size:12px; font-weight:900; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(145deg,#f7e7b6,#E8C15A 60%,#d4a93c);
    color:#3a2c07; border:1px solid rgba(232,193,90,0.85);
    box-shadow:0 5px 16px -6px rgba(232,193,90,0.75);
    transition:transform .15s, filter .15s; white-space:nowrap;
}
.gx-upload-label:hover{ transform:translateY(-1px); filter:brightness(1.05); }
.gx-upload-label .material-icons{ font-size:16px; }
.gx-back{
    margin-top:auto; width:100%; height:34px; border-radius:11px;
    font-size:12px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:5px;
    background:transparent; color:#aab6c8; border:1px solid rgba(255,255,255,0.16); transition:all .15s;
}
.gx-back:hover{ color:#f5e3ae; border-color:rgba(232,193,90,0.45); background:rgba(232,193,90,0.06); }
.gx-back .material-icons{ font-size:15px; }

/* ── 🖼️ ฝั่งขวา ── */
.gx-main{ flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.gx-top{
    flex-shrink:0; display:flex; align-items:center; gap:10px;
    padding:12px 16px; border-bottom:1px solid rgba(232,193,90,0.14);
    background:linear-gradient(120deg,#0e1728,#0a101d);
}
.gx-search{ position:relative; flex:1; }
.gx-search .material-icons{ position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:19px; color:#8b9bb4; pointer-events:none; }
.gx-search input{
    width:100%; height:40px; border-radius:13px; padding:0 14px 0 40px;
    font-size:13.5px; font-weight:700; outline:none;
    background:rgba(2,8,19,0.55); border:1px solid rgba(255,255,255,0.10); color:#e2e8f0;
    transition:border-color .15s, box-shadow .15s;
}
.gx-search input:focus{ border-color:rgba(232,193,90,0.65); box-shadow:0 0 0 3px rgba(232,193,90,0.15); }
.gx-count-pill{
    flex-shrink:0; display:inline-flex; align-items:center; gap:6px;
    height:40px; padding:0 16px; border-radius:13px; white-space:nowrap;
    background:rgba(232,193,90,0.08); border:1px solid rgba(232,193,90,0.3);
    font-size:12px; font-weight:800; color:#c9d3e0;
}
#galleryCount{ color:#E8C15A; font-size:16px; font-weight:900; text-shadow:0 0 14px rgba(232,193,90,0.4); }

#galleryDropZone{
    margin:10px 16px 0; border-radius:15px; padding:14px; text-align:center;
    font-weight:800; font-size:12.5px; user-select:none;
    border:1.5px dashed rgba(232,193,90,0.5); background:rgba(232,193,90,0.05); color:#c9a54a;
    transition:background .2s, border-color .2s, box-shadow .2s;
}
#galleryDropZone:hover{ background:rgba(232,193,90,0.1); }
#galleryDropZone.gx-drag{
    background:rgba(232,193,90,0.18); border-color:#E8C15A; color:#f5e3ae;
    box-shadow:0 0 0 3px rgba(232,193,90,0.2), 0 0 24px rgba(232,193,90,0.25);
}
#galleryWebBadges{ padding:9px 16px; display:flex; flex-wrap:wrap; gap:6px; min-height:36px; border-bottom:1px solid rgba(232,193,90,0.12); }

/* ── การ์ดรูป (ของเดิม สวยอยู่แล้ว) ── */
.gx-card{
    background:linear-gradient(165deg,#131c30,#0d1422);
    border:1px solid rgba(255,255,255,0.07); border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; position:relative; height:100%;
    box-shadow:0 6px 18px -10px rgba(0,0,0,0.65);
    transition:transform .18s, box-shadow .18s, border-color .18s;
}
.gx-card:hover{
    transform:translateY(-3px); border-color:rgba(232,193,90,0.55);
    box-shadow:0 14px 30px -12px rgba(0,0,0,0.55), 0 0 22px -10px rgba(232,193,90,0.4);
}
.gx-card-img{
    height:14rem; width:100%; position:relative; overflow:hidden; flex-shrink:0;
    background:#05070d; display:flex; align-items:center; justify-content:center; cursor:zoom-in;
}
.gx-card-body{
    padding:9px 10px 10px; margin-top:auto; display:flex; flex-direction:column; gap:7px;
    background:rgba(2,8,19,0.4); border-top:1px solid rgba(232,193,90,0.12);
}
.gx-card-name{ font-size:11.5px; font-weight:800; color:#e2e8f0; }
.gx-cbtn{
    flex:1; height:30px; border-radius:9px; font-size:10px; font-weight:800;
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
    transition:transform .13s, filter .13s; box-shadow:0 3px 10px -5px rgba(0,0,0,0.4);
}
.gx-cbtn:hover{ filter:brightness(1.1); }
.gx-cbtn:active{ transform:scale(0.95); }
.gx-cbtn .material-icons{ font-size:13px; }
.gx-cbtn-copy{ background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:1px solid rgba(255,255,255,0.18); }
.gx-cbtn-dl{ background:linear-gradient(135deg,#10b981,#059669); color:#fff; border:1px solid rgba(255,255,255,0.18); }

/* ── แถบล่าง ── */
.gx-foot{
    flex-shrink:0; padding:9px 16px; display:flex; justify-content:space-between; align-items:center;
    gap:10px; flex-wrap:wrap; font-size:11px; color:#8b9bb4;
    background:linear-gradient(120deg,#0e1728,#0a101d); border-top:1px solid rgba(232,193,90,0.16);
}
.gx-foot label:hover{ color:#f5e3ae; }
#galleryPerPage{
    background:rgba(2,8,19,0.55); color:#e2e8f0; border:1px solid rgba(255,255,255,0.10);
    border-radius:9px; padding:3px 8px; font-size:11px; font-weight:700; outline:none; cursor:pointer;
}
#galleryLightbox{ backdrop-filter:blur(6px); }
#lightboxImg{ border:1px solid rgba(232,193,90,0.25); box-shadow:0 30px 80px -20px rgba(0,0,0,0.9), 0 0 50px -18px rgba(232,193,90,0.35); }

/* ── 📱 จอแคบ: แถบข้างพับขึ้นบน ── */
@media (max-width: 900px){
    .gx-app{ flex-direction:column; }
    .gx-side{ width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; gap:5px; padding:10px 12px; border-right:none; border-bottom:1px solid rgba(232,193,90,0.18); overflow:visible; }
    .gx-brand{ margin-bottom:0; margin-right:4px; }
    .gx-brand-sub{ display:none; }
    .gx-side-label{ display:none; }
    .gx-tabs{ flex-direction:row; flex-wrap:wrap; flex:1 1 100%; }
    .gx-tab{ width:auto; flex:1; justify-content:center; padding:7px 8px; font-size:11.5px; }
    .gx-select, .gx-btn, #btnBulkDelete, .gx-upload-label, #uploadCategory{ width:auto; flex:1 1 130px; margin-bottom:0; }
    #adminUploadControls{ flex-direction:row; flex:1 1 100%; }
    .gx-back{ margin-top:0; width:auto; flex:0 0 auto; padding:0 12px; }
}
</style>

    <!-- ═══ 🧭 แถบข้างซ้าย: หมวด + ตัวกรอง + ปุ่มงานทั้งหมด ═══ -->
    <aside class="gx-side">
        <div class="gx-brand">
            <div class="gx-brand-icon"><span class="material-icons">photo_library</span></div>
            <div>
                <div class="gx-brand-title">คลังรูป</div>
                <div class="gx-brand-sub">โปรโมชัน · โบนัส · เมนู · โลโก้</div>
            </div>
        </div>

        <div class="gx-side-label">หมวดรูป</div>
        <div class="gx-tabs">
            <button id="tabGeneral" onclick="switchGalleryMode('general')" class="gx-tab on" style="--tc:#2563eb">🖼️ รูปทั่วไป</button>
            <button id="tabBonus" onclick="switchGalleryMode('bonus')" class="gx-tab" style="--tc:#d97706">🎁 โบนัสไทม์</button>
            <button id="tabReach" onclick="switchGalleryMode('reach')" class="gx-tab" style="--tc:#a21caf">📣 รีชเมนู</button>
            <button id="tabCard" onclick="switchGalleryMode('card')" class="gx-tab" style="--tc:#059669">🃏 การ์ดเมนู</button>
            <button id="tabLogo" onclick="switchGalleryMode('logo')" class="gx-tab hidden" style="--tc:#e11d48">🏷️ LOGO</button>
        </div>

        <div class="gx-side-label">ตัวกรอง</div>
        <select id="galleryFilter" onchange="syncUploadCategory(); fetchGalleryImages()" class="gx-select">
            <option value="all">🌐 ทุกเว็บ</option>
        </select>
        <select id="gallerySort" onchange="fetchGalleryImages()" class="gx-select">
            <option value="newest">🕐 ใหม่สุด</option>
            <option value="oldest">🕐 เก่าสุด</option>
            <option value="name_asc">🔤 ชื่อ A-Z</option>
            <option value="name_desc">🔤 ชื่อ Z-A</option>
        </select>

        <div class="gx-side-label">การทำงาน</div>
        <button id="btnBulkDelete" onclick="deleteSelectedImages()" class="hidden bg-red-600 hover:bg-red-500 text-white font-bold flex items-center gap-1 shadow-lg border border-red-400 animate-pulse"><span class="material-icons text-sm">delete_sweep</span> ลบที่เลือก (<span id="selectedCount">0</span>)</button>
        <button onclick="downloadAllInFilter()" class="gx-btn gx-btn-dl"><span class="material-icons">download_for_offline</span> โหลดทั้งหมด</button>
        <div id="adminUploadControls" class="hidden">
            <select id="uploadCategory"><option value="ทั่วไป">ทั่วไป</option></select>
            <label class="gx-upload-label">
                <span class="material-icons">cloud_upload</span> อัปโหลดรูป
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(this)">
            </label>
        </div>

        <button onclick="showPage('dashboard')" class="gx-back"><span class="material-icons">arrow_back</span> กลับหน้าหลัก</button>
    </aside>

    <!-- ═══ 🖼️ ฝั่งขวา: ค้นหาใหญ่ + รูปเต็มพื้นที่ ═══ -->
    <div class="gx-main">
        <div class="gx-top">
            <div class="gx-search">
                <span class="material-icons">search</span>
                <input type="text" id="gallerySearch" onkeyup="filterGalleryImages()" placeholder="พิมพ์ชื่อรูปเพื่อค้นหา...">
            </div>
            <div class="gx-count-pill">ทั้งหมด <span id="galleryCount">0</span> รูป</div>
        </div>

        <div id="galleryDropZone" class="hidden">
            <span class="material-icons text-3xl mb-1 block">cloud_upload</span>
            ลากรูปมาวางที่นี่เพื่ออัปโหลด
        </div>

        <div id="galleryWebBadges"></div>

        <div id="galleryGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 content-start custom-scrollbar auto-rows-min"></div>

        <div class="gx-foot">
            <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="checkbox" onchange="toggleSelectAllImages(this)" class="w-4 h-4 rounded cursor-pointer accent-amber-400"> เลือกทั้งหมดในหน้านี้</label>
                <select id="galleryPerPage" onchange="fetchGalleryImages()">
                    <option value="20">20 รูป/หน้า</option>
                    <option value="50" selected>50 รูป/หน้า</option>
                    <option value="100">100 รูป/หน้า</option>
                    <option value="999">ทั้งหมด</option>
                </select>
            </div>
            <div id="galleryPagination" class="flex items-center gap-1"></div>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div id="galleryLightbox" class="hidden fixed inset-0 z-[9999] bg-black/90 flex items-center justify-center" onclick="closeLightbox()">
    <button onclick="event.stopPropagation();moveLightbox(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 text-white rounded-full w-12 h-12 flex items-center justify-center text-2xl font-bold transition z-10">&#8249;</button>
    <div class="flex flex-col items-center max-w-[90vw] max-h-[90vh]" onclick="event.stopPropagation()">
        <img id="lightboxImg" src="" class="max-w-[85vw] max-h-[80vh] object-contain rounded-xl shadow-2xl">
        <div class="mt-3 flex items-center gap-3 flex-wrap justify-center">
            <span id="lightboxName" class="text-white font-bold text-sm"></span>
            <span id="lightboxCounter" class="text-gray-400 text-xs"></span>
            <span id="lightboxDate" class="text-gray-500 text-xs"></span>
            <button onclick="event.stopPropagation(); _copyLightboxUrl()" class="bg-violet-600 hover:bg-violet-500 text-white px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition"><span class="material-icons text-sm">link</span>Copy URL</button>
            <button id="lightboxRename" onclick="event.stopPropagation(); _renameLightboxImg()" class="hidden bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition"><span class="material-icons text-sm">edit</span>แก้ชื่อ</button>
            <a id="lightboxDownload" href="" download class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition"><span class="material-icons text-sm">download</span>โหลด</a>
        </div>
    </div>
    <button onclick="event.stopPropagation();moveLightbox(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 text-white rounded-full w-12 h-12 flex items-center justify-center text-2xl font-bold transition z-10">&#8250;</button>
    <button onclick="closeLightbox()" class="absolute top-4 right-4 bg-white/20 hover:bg-white/40 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-bold transition">✕</button>
</div>

<div id="galleryTemplates" style="display: none;">
    <template id="tpl-gallery-card">
        <div class="gx-card group">
            <div class="gx-card-img" data-lb-index="{{lbIndex}}" onclick="openLightbox(parseInt(this.dataset.lbIndex))">
                {{newBadge}}
                {{adminCheckbox}}
                {{catBadge}}
                <img src="{{thumb}}" class="w-full h-full object-contain transition duration-300 group-hover:scale-105" loading="lazy" decoding="async" style="background:linear-gradient(135deg,#1e293b,#0f172a)">
                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition flex flex-col items-center justify-center pointer-events-none">
                    <span class="material-icons text-white text-4xl opacity-0 group-hover:opacity-80 transition">zoom_in</span>
                    <span class="text-white text-[10px] font-bold opacity-0 group-hover:opacity-90 transition mt-1 bg-black/50 px-2 py-0.5 rounded">{{uploadDate}}</span>
                    <span class="text-gray-300 text-[9px] opacity-0 group-hover:opacity-80 transition bg-black/50 px-2 py-0.5 rounded mt-0.5">{{uploadBy}}</span>
                </div>
            </div>
            <div class="gx-card-body">
                <div class="flex items-center gap-1 group/name">
                    <span class="gx-card-name truncate flex-1 text-center" title="{{name}}">{{name}}</span>
                    {{renameBtn}}
                </div>
                <div class="flex gap-2 w-full">
                    <button onclick="event.stopPropagation(); copyImageToClipboard('{{url}}')" class="gx-cbtn gx-cbtn-copy">
                        <span class="material-icons">content_copy</span> คัดลอก
                    </button>
                    <button onclick="event.stopPropagation(); downloadGalleryUrl('{{url}}', '{{name}}')" class="gx-cbtn gx-cbtn-dl">
                        <span class="material-icons">download</span> โหลด
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>
