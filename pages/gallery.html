<div id="galleryApp" class="fade-in flex flex-col h-full overflow-hidden pb-0 gx-app">
<style>
/* ════════════════════════════════════════════════════
   🎩 คลังรูป — Premium Redesign (กราไฟต์ดำ × ทองแชมเปญ)
   โครง id / onclick / template placeholder เดิมครบทุกตัว
   ════════════════════════════════════════════════════ */
.gx-app{
    background:#f1f5f9; border-radius:22px; border:1px solid #e2e8f0;
    box-shadow:0 10px 40px -12px rgba(0,0,0,0.18);
}
html.dark .gx-app{
    background:linear-gradient(180deg,#0c1424 0%,#0a0f1c 100%);
    border:1px solid rgba(232,193,90,0.14);
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 18px 60px -18px rgba(0,0,0,0.85);
}

/* ── แถบหัว 2 ชั้น ── */
.gx-head{
    flex-shrink:0; padding:12px 16px 10px;
    background:#ffffff; border-bottom:1px solid #e2e8f0;
}
html.dark .gx-head{
    background:linear-gradient(120deg,#101a2e 0%,#0b1322 60%,#0a101d 100%);
    border-bottom:1px solid rgba(232,193,90,0.20);
}
.gx-row1{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.gx-brand{ display:flex; align-items:center; gap:11px; flex-shrink:0; }
.gx-brand-icon{
    width:40px; height:40px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#f7e7b6,#E8C15A 55%,#c99a33);
    color:#3a2c07; box-shadow:0 6px 16px -6px rgba(232,193,90,0.7), inset 0 1px 0 rgba(255,255,255,0.6);
}
.gx-brand-icon .material-icons{ font-size:21px; }
.gx-brand-title{ font-size:1.05rem; font-weight:900; color:#1e293b; line-height:1.15; }
html.dark .gx-brand-title{ color:#f1f5f9; }
.gx-brand-sub{ font-size:10px; color:#94a3b8; }
html.dark .gx-brand-sub{ color:#8b9bb4; }

/* กลุ่มแท็บ — JS เขียนทับ className ของปุ่มทุกครั้ง จึงแต่งทรงผ่าน id + !important */
.gx-tabs{
    flex:1 1 420px; display:flex; gap:6px; flex-wrap:wrap;
    padding:5px; border-radius:14px;
    background:rgba(15,23,42,0.05); border:1px solid rgba(15,23,42,0.07);
}
html.dark .gx-tabs{
    background:rgba(2,8,19,0.55); border:1px solid rgba(232,193,90,0.16);
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.45);
}
#tabGeneral, #tabBonus, #tabReach, #tabCard, #tabLogo{
    border-radius:10px !important;
    padding:7px 10px !important;
    font-size:12px !important;
    min-width:104px !important;
    letter-spacing:0.01em;
    box-shadow:none;
}
#tabGeneral.transform, #tabBonus.transform, #tabReach.transform, #tabCard.transform, #tabLogo.transform{
    box-shadow:0 5px 16px -5px rgba(0,0,0,0.55) !important;
}
.gx-back{
    flex-shrink:0; height:36px; padding:0 14px; border-radius:11px;
    font-size:12px; font-weight:800; display:inline-flex; align-items:center; gap:5px;
    background:transparent; color:#64748b; border:1px solid #cbd5e1;
    transition:all .15s;
}
html.dark .gx-back{ color:#aab6c8; border:1px solid rgba(255,255,255,0.16); }
html.dark .gx-back:hover{ color:#f5e3ae; border-color:rgba(232,193,90,0.45); background:rgba(232,193,90,0.06); }
.gx-back .material-icons{ font-size:15px; }

/* แถวเครื่องมือ */
.gx-row2{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:10px; padding-top:10px;
    border-top:1px dashed rgba(148,163,184,0.3);
}
html.dark .gx-row2{ border-top:1px dashed rgba(232,193,90,0.16); }
.gx-select, .gx-input{
    height:34px; border-radius:11px; font-size:12px; font-weight:700;
    background:#f8fafc; border:1px solid #e2e8f0; color:#1e293b;
    outline:none; transition:border-color .15s, box-shadow .15s;
}
html.dark .gx-select, html.dark .gx-input{
    background:rgba(2,8,19,0.55); border:1px solid rgba(255,255,255,0.10); color:#e2e8f0;
}
.gx-select:focus, .gx-input:focus{
    border-color:rgba(232,193,90,0.65);
    box-shadow:0 0 0 3px rgba(232,193,90,0.15);
}
.gx-select{ padding:0 10px; cursor:pointer; }
.gx-search{ position:relative; flex:1 1 240px; max-width:430px; }
.gx-search .material-icons{ position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:17px; color:#94a3b8; pointer-events:none; }
.gx-search input{ width:100%; padding:0 12px 0 33px; }
.gx-btn{
    height:34px; padding:0 13px; border-radius:11px;
    font-size:11.5px; font-weight:800; display:inline-flex; align-items:center; gap:5px;
    transition:transform .15s, filter .15s, box-shadow .15s;
    box-shadow:0 5px 14px -6px rgba(0,0,0,0.4); white-space:nowrap;
}
.gx-btn:hover{ transform:translateY(-1px); filter:brightness(1.08); }
.gx-btn:active{ transform:scale(0.97); }
.gx-btn .material-icons{ font-size:15px; }
.gx-btn-dl{ background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:1px solid rgba(255,255,255,0.2); }
#btnBulkDelete{
    height:34px !important; padding:0 13px !important; border-radius:11px !important;
    font-size:11.5px !important;
}
#adminUploadControls{ border-left:1px solid rgba(148,163,184,0.35) !important; padding-left:10px !important; }
html.dark #adminUploadControls{ border-left:1px solid rgba(232,193,90,0.25) !important; }
#uploadCategory{
    height:34px; border-radius:11px !important; font-size:12px !important;
    background:rgba(2,8,19,0.55) !important; color:#f5e3ae !important;
    border:1px solid rgba(232,193,90,0.4) !important; padding:0 10px !important;
    outline:none; cursor:pointer;
}
.gx-upload-label{
    height:34px; padding:0 14px; border-radius:11px; cursor:pointer;
    font-size:11.5px; font-weight:800; display:inline-flex; align-items:center; gap:5px;
    background:linear-gradient(145deg,#f7e7b6,#E8C15A 60%,#d4a93c);
    color:#3a2c07; border:1px solid rgba(232,193,90,0.85);
    box-shadow:0 5px 16px -6px rgba(232,193,90,0.75);
    transition:transform .15s, filter .15s; white-space:nowrap;
}
.gx-upload-label:hover{ transform:translateY(-1px); filter:brightness(1.05); }
.gx-upload-label .material-icons{ font-size:15px; }

/* Drop zone */
#galleryDropZone{
    border:1.5px dashed rgba(232,193,90,0.5) !important;
    background:rgba(232,193,90,0.05) !important;
    color:#c9a54a !important;
    border-radius:15px !important;
    transition:background .2s, border-color .2s;
}
#galleryDropZone:hover{ background:rgba(232,193,90,0.1) !important; }

/* ป้ายจำนวนต่อเว็บ */
#galleryWebBadges{
    border-bottom:1px solid rgba(148,163,184,0.2) !important;
    background:transparent;
}
html.dark #galleryWebBadges{ border-bottom:1px solid rgba(232,193,90,0.12) !important; }

/* ── การ์ดรูป ── */
.gx-card{
    background:#ffffff; border:1px solid #e2e8f0;
    border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; position:relative; height:100%;
    box-shadow:0 4px 14px -8px rgba(0,0,0,0.18);
    transition:transform .18s, box-shadow .18s, border-color .18s;
}
html.dark .gx-card{
    background:linear-gradient(165deg,#131c30,#0d1422);
    border:1px solid rgba(255,255,255,0.07);
    box-shadow:0 6px 18px -10px rgba(0,0,0,0.65);
}
.gx-card:hover{
    transform:translateY(-3px);
    border-color:rgba(232,193,90,0.55);
    box-shadow:0 14px 30px -12px rgba(0,0,0,0.55), 0 0 22px -10px rgba(232,193,90,0.4);
}
.gx-card-img{
    height:14rem; width:100%; position:relative; overflow:hidden; flex-shrink:0;
    background:#05070d; display:flex; align-items:center; justify-content:center;
    cursor:zoom-in;
}
.gx-card-body{
    padding:9px 10px 10px; margin-top:auto;
    display:flex; flex-direction:column; gap:7px;
    border-top:1px solid rgba(148,163,184,0.15);
}
html.dark .gx-card-body{ background:rgba(2,8,19,0.4); border-top:1px solid rgba(232,193,90,0.12); }
.gx-card-name{ font-size:11.5px; font-weight:800; color:#334155; }
html.dark .gx-card-name{ color:#e2e8f0; }
.gx-cbtn{
    flex:1; height:30px; border-radius:9px;
    font-size:10px; font-weight:800;
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
    transition:transform .13s, filter .13s;
    box-shadow:0 3px 10px -5px rgba(0,0,0,0.4);
}
.gx-cbtn:hover{ filter:brightness(1.1); }
.gx-cbtn:active{ transform:scale(0.95); }
.gx-cbtn .material-icons{ font-size:13px; }
.gx-cbtn-copy{ background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:1px solid rgba(255,255,255,0.18); }
.gx-cbtn-dl{ background:linear-gradient(135deg,#10b981,#059669); color:#fff; border:1px solid rgba(255,255,255,0.18); }

/* ── แถบล่าง ── */
.gx-foot{
    flex-shrink:0; padding:9px 16px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:11px; color:#64748b;
    background:#ffffff; border-top:1px solid #e2e8f0;
}
html.dark .gx-foot{
    background:linear-gradient(120deg,#0e1728,#0a101d);
    border-top:1px solid rgba(232,193,90,0.16); color:#8b9bb4;
}
.gx-foot label:hover{ color:#b45309; }
html.dark .gx-foot label:hover{ color:#f5e3ae; }
#galleryCount{ color:#b45309 !important; }
html.dark #galleryCount{ color:#E8C15A !important; text-shadow:0 0 14px rgba(232,193,90,0.4); }
#galleryPerPage{
    background:#f8fafc; color:#1e293b; border:1px solid #e2e8f0;
    border-radius:9px; padding:3px 8px; font-size:11px; font-weight:700; outline:none; cursor:pointer;
}
html.dark #galleryPerPage{ background:rgba(2,8,19,0.55); color:#e2e8f0; border:1px solid rgba(255,255,255,0.10); }

/* Lightbox แต่งเพิ่มเล็กน้อย */
#galleryLightbox{ backdrop-filter:blur(6px); }
#lightboxImg{ border:1px solid rgba(232,193,90,0.25); box-shadow:0 30px 80px -20px rgba(0,0,0,0.9), 0 0 50px -18px rgba(232,193,90,0.35) !important; }
</style>

    <!-- ═══════ 🥇 แถบหัว ═══════ -->
    <div class="gx-head">
        <div class="gx-row1">
            <div class="gx-brand">
                <div class="gx-brand-icon"><span class="material-icons">photo_library</span></div>
                <div>
                    <div class="gx-brand-title">คลังรูป</div>
                    <div class="gx-brand-sub">รวมรูปโปรโมชัน · โบนัส · เมนู · โลโก้ ทุกเว็บ</div>
                </div>
            </div>

            <div class="gx-tabs">
                <button id="tabGeneral" onclick="switchGalleryMode('general')" class="flex-1 min-w-[110px] py-2 rounded-lg font-bold text-sm transition bg-blue-600 text-white shadow-lg border border-blue-400 transform scale-105">🖼️ รูปทั่วไป</button>
                <button id="tabBonus" onclick="switchGalleryMode('bonus')" class="flex-1 min-w-[110px] py-2 rounded-lg font-bold text-sm transition bg-slate-700 text-gray-400 hover:text-white border border-transparent">🎁 โบนัสไทม์</button>
                <button id="tabReach" onclick="switchGalleryMode('reach')" class="flex-1 min-w-[110px] py-2 rounded-lg font-bold text-sm transition bg-slate-700 text-gray-400 hover:text-white border border-transparent">📣 รีชเมนู</button>
                <button id="tabCard" onclick="switchGalleryMode('card')" class="flex-1 min-w-[110px] py-2 rounded-lg font-bold text-sm transition bg-slate-700 text-gray-400 hover:text-white border border-transparent">🃏 การ์ดเมนู</button>
                <button id="tabLogo" onclick="switchGalleryMode('logo')" class="hidden flex-1 min-w-[110px] py-2 rounded-lg font-bold text-sm transition bg-slate-700 text-gray-400 hover:text-white border border-transparent">🏷️ LOGO</button>
            </div>

            <button onclick="showPage('dashboard')" class="gx-back"><span class="material-icons">arrow_back</span> กลับ</button>
        </div>

        <!-- ═══════ 🛠️ แถวเครื่องมือ ═══════ -->
        <div class="gx-row2">
            <select id="galleryFilter" onchange="syncUploadCategory(); fetchGalleryImages()" class="gx-select">
                <option value="all">-- ทุกเว็บ --</option>
            </select>
            <select id="gallerySort" onchange="fetchGalleryImages()" class="gx-select">
                <option value="newest">🕐 ใหม่สุด</option>
                <option value="oldest">🕐 เก่าสุด</option>
                <option value="name_asc">🔤 ชื่อ A-Z</option>
                <option value="name_desc">🔤 ชื่อ Z-A</option>
            </select>

            <div class="gx-search">
                <span class="material-icons">search</span>
                <input type="text" id="gallerySearch" onkeyup="filterGalleryImages()" placeholder="พิมพ์ชื่อรูปเพื่อค้นหา..." class="gx-input">
            </div>

            <button id="btnBulkDelete" onclick="deleteSelectedImages()" class="hidden bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg font-bold text-sm flex items-center gap-1 shadow-lg border border-red-400 animate-pulse"><span class="material-icons text-sm">delete_sweep</span> ลบที่เลือก (<span id="selectedCount">0</span>)</button>
            <button onclick="downloadAllInFilter()" class="gx-btn gx-btn-dl"><span class="material-icons">download_for_offline</span> โหลดทั้งหมด</button>

            <div id="adminUploadControls" class="flex items-center gap-2 hidden pl-2 border-l border-gray-600">
                <select id="uploadCategory"><option value="ทั่วไป">ทั่วไป</option></select>
                <label class="gx-upload-label">
                    <span class="material-icons">cloud_upload</span> อัปโหลด
                    <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(this)">
                </label>
            </div>
        </div>
    </div>
    
    <!-- Drag & Drop Zone -->
    <div id="galleryDropZone" class="hidden mx-4 mt-2 rounded-xl p-4 text-center font-bold text-sm select-none">
        <span class="material-icons text-3xl mb-1 block">cloud_upload</span>
        ลากรูปมาวางที่นี่เพื่ออัปโหลด
    </div>

    <!-- Badge count per web -->
    <div id="galleryWebBadges" class="px-4 py-2 flex flex-wrap gap-1.5 border-b border-gray-700 min-h-[36px]"></div>

    <!-- Grid รูป -->
    <div id="galleryGrid" class="flex-1 overflow-y-auto p-4 bg-slate-100 dark:bg-transparent grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 content-start custom-scrollbar auto-rows-min"></div>
    
    <!-- ═══════ แถบล่าง ═══════ -->
    <div class="gx-foot">
        <div class="flex items-center gap-3">
            <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="checkbox" onchange="toggleSelectAllImages(this)" class="w-4 h-4 rounded cursor-pointer accent-amber-400"> เลือกทั้งหมดในหน้านี้</label>
            <select id="galleryPerPage" onchange="fetchGalleryImages()">
                <option value="20">20 รูป/หน้า</option>
                <option value="50" selected>50 รูป/หน้า</option>
                <option value="100">100 รูป/หน้า</option>
                <option value="999">ทั้งหมด</option>
            </select>
        </div>
        <div id="galleryPagination" class="flex items-center gap-1"></div>
        <div>พบรูปภาพทั้งหมด: <span id="galleryCount" class="font-black text-sm">0</span> รูป</div>
    </div>
</div>

<!-- Lightbox -->
<div id="galleryLightbox" class="hidden fixed inset-0 z-[9999] bg-black/90 flex items-center justify-center" onclick="closeLightbox()">
    <button onclick="event.stopPropagation();moveLightbox(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 text-white rounded-full w-12 h-12 flex items-center justify-center text-2xl font-bold transition z-10">&#8249;</button>
    <div class="flex flex-col items-center max-w-[90vw] max-h-[90vh]" onclick="event.stopPropagation()">
        <img id="lightboxImg" src="" class="max-w-[85vw] max-h-[80vh] object-contain rounded-xl shadow-2xl">
        <div class="mt-3 flex items-center gap-3 flex-wrap justify-center">
            <span id="lightboxName" class="text-white font-bold text-sm"></span>
            <span id="lightboxCounter" class="text-gray-400 text-xs"></span>
            <span id="lightboxDate" class="text-gray-500 text-xs"></span>
            <button onclick="event.stopPropagation(); _copyLightboxUrl()" class="bg-violet-600 hover:bg-violet-500 text-white px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition"><span class="material-icons text-sm">link</span>Copy URL</button>
            <button id="lightboxRename" onclick="event.stopPropagation(); _renameLightboxImg()" class="hidden bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition"><span class="material-icons text-sm">edit</span>แก้ชื่อ</button>
            <a id="lightboxDownload" href="" download class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition"><span class="material-icons text-sm">download</span>โหลด</a>
        </div>
    </div>
    <button onclick="event.stopPropagation();moveLightbox(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 text-white rounded-full w-12 h-12 flex items-center justify-center text-2xl font-bold transition z-10">&#8250;</button>
    <button onclick="closeLightbox()" class="absolute top-4 right-4 bg-white/20 hover:bg-white/40 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-bold transition">✕</button>
</div>

<div id="galleryTemplates" style="display: none;">
    <template id="tpl-gallery-card">
        <div class="gx-card group">
            <div class="gx-card-img" data-lb-index="{{lbIndex}}" onclick="openLightbox(parseInt(this.dataset.lbIndex))">
                {{newBadge}}
                {{adminCheckbox}}
                {{catBadge}}
                <img src="{{url}}" class="w-full h-full object-contain transition duration-300 group-hover:scale-105" loading="lazy">
                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition flex flex-col items-center justify-center pointer-events-none">
                    <span class="material-icons text-white text-4xl opacity-0 group-hover:opacity-80 transition">zoom_in</span>
                    <span class="text-white text-[10px] font-bold opacity-0 group-hover:opacity-90 transition mt-1 bg-black/50 px-2 py-0.5 rounded">{{uploadDate}}</span>
                    <span class="text-gray-300 text-[9px] opacity-0 group-hover:opacity-80 transition bg-black/50 px-2 py-0.5 rounded mt-0.5">{{uploadBy}}</span>
                </div>
            </div>
            <div class="gx-card-body">
                <div class="flex items-center gap-1 group/name">
                    <span class="gx-card-name truncate flex-1 text-center" title="{{name}}">{{name}}</span>
                    {{renameBtn}}
                </div>
                <div class="flex gap-2 w-full">
                    <button onclick="event.stopPropagation(); copyImageToClipboard('{{url}}')" class="gx-cbtn gx-cbtn-copy">
                        <span class="material-icons">content_copy</span> คัดลอก
                    </button>
                    <button onclick="event.stopPropagation(); downloadGalleryUrl('{{url}}', '{{name}}')" class="gx-cbtn gx-cbtn-dl">
                        <span class="material-icons">download</span> โหลด
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>
