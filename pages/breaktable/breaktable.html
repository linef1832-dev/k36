<!-- 📊 ตารางลงเวลาพัก (ใครลงกินข้าวกี่โมง) — แบบการ์ดตามช่วงเวลา + กดดูรายละเอียด -->
<div class="w-full animate-fade-in pb-10" id="btPage">
    <style>
        #btPage .bt-card{background:#0b1220;border:1px solid rgba(148,163,184,.14);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:66px;transition:border-color .15s,background .15s}
        #btPage .bt-card:hover{border-color:rgba(96,165,250,.5);background:#0e1730}
        #btPage .bt-card.bt-empty{opacity:.55}
        #btPage .bt-time{font-weight:800;font-size:15px;color:#f1f5f9;letter-spacing:.2px;font-family:ui-monospace,Menlo,monospace}
        #btPage .bt-sub{font-size:11.5px;color:#94a3b8;margin-top:3px}
        .bt-av{width:28px;height:28px;border-radius:50%;border:2px solid #0b1220;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;color:#fff;margin-left:-8px;letter-spacing:.3px}
        .bt-av:first-child{margin-left:0}
        .bt-more{background:#334155;color:#e2e8f0}
        #btPage .bt-eye{width:30px;height:30px;border-radius:8px;border:1px solid rgba(148,163,184,.2);background:rgba(148,163,184,.06);color:#cbd5e1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
        #btPage .bt-eye:hover{border-color:#60a5fa;color:#93c5fd}
        #btPage .bt-sel{background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700;outline:none;min-width:130px}
        #btPage .bt-sel:focus{border-color:#60a5fa}
        #btPage .bt-navbtn{width:34px;height:34px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#cbd5e1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
        #btPage .bt-navbtn:hover{border-color:#60a5fa;color:#fff}
        #btPage .bt-shift-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid rgba(148,163,184,.14)}
        .bt-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#cbd5e1;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
        .bt-chip.on{border-color:#3b82f6;color:#93c5fd;background:rgba(59,130,246,.15)}
        .bt-chip b{background:#1e293b;padding:0 7px;border-radius:5px;font-size:11px}
        .bt-row{display:grid;grid-template-columns:1.4fr .7fr .8fr .9fr 1.1fr 42px;gap:8px;align-items:center;padding:10px 8px;border-bottom:1px solid rgba(148,163,184,.1);font-size:13px}
        .bt-row:hover{background:rgba(148,163,184,.05)}
        .bt-det{grid-column:1/-1;font-size:11.5px;color:#94a3b8;padding:0 8px 6px 46px;display:none;line-height:1.6}
        .bt-row.open .bt-det{display:block}
        .bt-tag{display:inline-block;background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
        /* 🔴 ไฮไลต์รอบที่กำลังเดินอยู่ตอนนี้ */
        #btPage .bt-card.bt-now{border-color:#22d3ee;background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(16,185,129,.06));box-shadow:0 0 0 1px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.25);opacity:1}
        #btPage .bt-now-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.45);color:#67e8f9;font-size:10px;font-weight:900;padding:1px 8px;border-radius:99px;margin-left:6px;white-space:nowrap}
        #btPage .bt-now-dot{width:6px;height:6px;border-radius:50%;background:#22d3ee;animation:btPulse 1.2s infinite}
        @keyframes btPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
        /* 🟠 ป้ายยังไม่ลงพัก */
        .bt-missing-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fbbf24;font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:99px;cursor:pointer;transition:background .15s}
        .bt-missing-badge:hover{background:rgba(245,158,11,.25)}
    </style>

    <!-- หัว: ชื่อหน้า + ตัวเลื่อนวัน + รีเฟรช -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 bg-[#151f32] p-4 rounded-2xl border border-slate-700 shadow-xl">
        <div>
            <h2 class="text-xl font-black text-white flex items-center gap-2"><span class="material-icons text-cyan-400">restaurant</span> ลงเวลากินข้าว</h2>
            <p class="text-[11px] text-gray-400 mt-1" id="btSubTitle">ใครลงพักช่วงไหน — กด 👁 ที่ช่วงเวลาเพื่อดูรายชื่อ</p>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button class="bt-navbtn" onclick="btShiftDate(-1)" title="วันก่อน"><span class="material-icons text-[18px]">chevron_left</span></button>
            <input type="date" id="wDate" onchange="btRender()" class="bt-sel" style="min-width:150px;text-align:center">
            <button class="bt-navbtn" onclick="btShiftDate(1)" title="วันถัดไป"><span class="material-icons text-[18px]">chevron_right</span></button>
            <span id="btUpdatedAt" class="text-[11px] text-gray-500 ml-1"></span>
            <button id="btExportBtn" onclick="btExportExcel()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-bold items-center gap-1" style="display:none"><span class="material-icons text-sm">download</span> Excel</button>
            <button onclick="btRender(true)" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1"><span class="material-icons text-sm">refresh</span> รีเฟรช</button>
        </div>
    </div>

    <!-- ตัวกรอง -->
    <div class="bg-[#0f172a] mt-3 p-3 rounded-2xl border border-slate-700 flex flex-wrap gap-3 items-end">
        <div><div class="text-[10px] text-gray-400 font-bold mb-1">แผนก</div><select id="btDept" class="bt-sel" onchange="btRender()"><option value="all">ทุกแผนก</option><option value="AM">AM</option><option value="OD">OD</option></select></div>
        <div><div class="text-[10px] text-gray-400 font-bold mb-1">เว็บ</div><select id="btTeam" class="bt-sel" onchange="btRender()"><option value="all">ทุกเว็บ</option></select></div>
        <div><div class="text-[10px] text-gray-400 font-bold mb-1">กะ</div><select id="btShift" class="bt-sel" onchange="btRender()"><option value="all">ทุกกะ</option><option value="กะเช้า">☀️ กะเช้า</option><option value="กะกลาง">🌤️ กะกลาง</option><option value="กะดึก">🌙 กะดึก</option></select></div>
        <div class="flex-1 min-w-[160px]"><div class="text-[10px] text-gray-400 font-bold mb-1">ค้นหาชื่อ</div><input id="btSearch" oninput="btRender()" placeholder="พิมพ์ชื่อ..." class="bt-sel w-full"></div>
    </div>

    <!-- สรุป + การ์ดช่วงเวลา -->
    <div class="flex items-center justify-between mt-4 mb-1">
        <div class="text-lg font-black text-white" id="btDateTitle">—</div>
        <div class="flex items-center gap-2"><span id="btMissing"></span><span class="text-[12px] text-gray-400" id="btTotal">จองแล้ว 0 คน</span></div>
    </div>
    <div id="btGrid"><div class="text-center text-gray-500 py-10 text-sm"><span class="material-icons animate-spin text-3xl text-blue-500">sync</span><br>กำลังโหลด...</div></div>
</div>
